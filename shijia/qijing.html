    <body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col justify-between">
        <div
            class="container mx-auto max-w-4xl p-6 mt-10 bg-white rounded-xl shadow-md border border-slate-100"
        >
            <h1 class="text-2xl font-bold text-slate-700 mb-6 text-center border-b pb-4">
                📊 表格自动合并工具
            </h1>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                <div>
                    <label class="block text-sm text-gray-600 mb-1">要处理的列名 (多列+分隔)</label>
                    <input
                        id="targetColumn"
                        type="text"
                        value="M"
                        placeholder="A+B+C"
                        class="w-full border rounded px-3 py-2"
                    />
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">起始行号 (包含此行)</label>
                    <input
                        id="startRow"
                        type="number"
                        value="3"
                        class="w-full border rounded px-3 py-2"
                    />
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1"
                        >联合唯一性列名 (多列+分隔)</label
                    >
                    <input
                        type="text"
                        id="uniqueKeyColumns"
                        value="B+C+K"
                        placeholder="A+B+C"
                        class="w-full px-3 py-2 border rounded-lg"
                    />
                </div>
                <div>
                    <label class="block text-sm text-gray-600 mb-1">覆盖填充背景色</label>
                    <select
                        id="fillColorSelect"
                        class="w-full px-3 py-2 border rounded-lg bg-white"
                    >
                        <option value="FFC00000" selected>🟥 标准红 (Red)</option>
                        <option value="FF00B050">🟩 标准绿 (Green)</option>
                        <option value="FF00B0F0">🟦 标准蓝 (Blue)</option>
                        <option value="FFF2BA02">🟨 标准黄 (Yellow)</option>
                        <option value="FFEE822F">🟧 标准橙 (Orange)</option>
                        <option value="NONE">⚪ 无填充 (不染色)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div
                    class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-4 bg-slate-50"
                >
                    <span class="text-sm font-medium text-slate-600 mb-2"
                        >📁 Alice小宝宝的基础表 (Excel1)</span
                    >
                    <input type="file" id="uploadExcel1" accept=".xlsx" class="text-xs" />
                </div>
                <div
                    class="flex flex-col items-center justify-center border-2 border-dashed border-slate-300 rounded-xl p-4 bg-slate-50"
                >
                    <span class="text-sm font-medium text-slate-600 mb-2"
                        >📁 Alice小伙伴的补充表 (Excel2)</span
                    >
                    <input type="file" id="uploadExcel2" accept=".xlsx" class="text-xs" />
                </div>
            </div>

            <div class="flex gap-4">
                <button
                    id="btnProcess"
                    class="flex-1 bg-blue-600 text-white font-medium py-3 px-4 rounded-xl shadow-md hover:bg-blue-700 transition"
                >
                    ⚡ 执行合并分析
                </button>
                <button
                    id="btnDownload"
                    disabled
                    class="flex-1 bg-slate-300 text-slate-500 font-medium py-3 px-4 rounded-xl cursor-not-allowed transition"
                >
                    📥 下载Excel + 报告
                </button>
            </div>
        </div>

        <div
            class="container mx-auto max-w-4xl p-4 my-6 bg-slate-900 text-slate-200 rounded-xl shadow-lg"
        >
            <h3 class="text-sm font-semibold text-slate-400 mb-2">状态报告区</h3>
            <div
                id="statusReport"
                class="text-xs font-mono max-h-40 overflow-y-auto space-y-1 text-slate-300 bg-slate-950 p-3 rounded"
            >
                等待上传文件并点击“执行合并分析”...
            </div>
        </div>

        <script>
            $(document).ready(function () {
                let workbook1 = null;
                let actualFile1Name = 'Excel 1 基础表';
                let actualFile2Name = 'Excel 2 补充表';
                let capturedLogs = [];
                let mismatchRows = [];
                let mergedRows = [];
                let isRunning = false;

                const SVG_MARGIN = 20;
                const SVG_MAX_TEXT_WIDTH = 860; // 最大文本行宽，超出自动换行
                const LINE_HEIGHT = 22;

                function getLineIntervals(rows) {
                    if (rows.length === 0) return [];
                    rows.sort((a, b) => a - b);
                    let result = [];
                    let start = rows[0];
                    let end = rows[0];
                    for (let i = 1; i < rows.length; i++) {
                        if (rows[i] === end + 1) {
                            end = rows[i];
                        } else {
                            result.push(start === end ? `${start}` : `${start}-${end}`);
                            start = rows[i];
                            end = rows[i];
                        }
                    }
                    result.push(start === end ? `${start}` : `${start}-${end}`);
                    return result;
                }

                function getTimeStamp() {
                    const now = new Date();
                    return (
                        `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ` +
                        `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}.` +
                        `${String(now.getMilliseconds()).padStart(3, '0')}`
                    );
                }

                function parseColumnList(inputStr) {
                    return inputStr
                        .trim()
                        .toUpperCase()
                        .split('+')
                        .map((s) => s.trim())
                        .filter((s) => s !== '');
                }

                function getVerifySourceText() {
                    const targetCols = $('#targetColumn').val().trim().toUpperCase();
                    const keyCols = $('#uniqueKeyColumns').val().trim().toUpperCase();
                    const color = $('#fillColorSelect').val();
                    const combineStr = [
                        actualFile1Name,
                        actualFile2Name,
                        targetCols,
                        keyCols,
                        color,
                        JSON.stringify(capturedLogs),
                        JSON.stringify(mismatchRows),
                        JSON.stringify(mergedRows),
                    ].join('|||');
                    return combineStr;
                }

                /**
                 * 工具：文本自动换行拆分，用于SVG
                 */
                function wrapText(text, maxWidth = SVG_MAX_TEXT_WIDTH) {
                    // 简易按空格切分换行，可根据需要优化
                    const words = text.split(' ');
                    const lines = [];
                    let currentLine = '';
                    for (const w of words) {
                        const test = (currentLine ? currentLine + ' ' : '') + w;
                        if (test.length > 110) {
                            lines.push(currentLine);
                            currentLine = w;
                        } else {
                            currentLine = test;
                        }
                    }
                    if (currentLine) lines.push(currentLine);
                    return lines;
                }

                // ====================== 导出纯 HTML 网页格式报告（彻底杜绝文本重叠） ======================
                async function exportSvgReport(timeStr) {
                    const htmlParts = [];

                    // 1. 构建 HTML 框架及响应式样式（最大宽度100vw，四周20px margin，支持文本强行换行）
                    htmlParts.push(`<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数据自动覆盖合并分析报告</title>
    <style>
        body { margin: 0; background-color: #f8fafc; font-family: Consolas, "PingFang SC", system-ui, sans-serif; display: flex; justify-content: center; }
        .report-container { width: 100vw; max-width: 100vw; margin: 20px; box-sizing: border-box; background: #ffffff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .title { font-size: 24px; font-weight: bold; color: #1e293b; margin-bottom: 8px; text-align: center; }
        .subinfo { font-size: 12px; color: #64748b; margin-bottom: 24px; text-align: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px; }
        .section-title { font-size: 16px; font-weight: bold; color: #92400e; margin-top: 24px; margin-bottom: 12px; border-left: 4px solid #92400e; padding-left: 8px; }
        .log-p { font-size: 13px; color: #334155; line-height: 1.6; margin: 0 0 8px 0; word-break: break-all; white-space: pre-wrap; border-bottom: 1px dashed #f1f5f9; padding-bottom: 6px; }
        .text-green { color: #16a34a; font-weight: bold; }
        .text-red { color: #dc2626; font-weight: bold; }
        .info-block { background: #f1f5f9; padding: 14px; border-radius: 6px; margin-bottom: 16px; font-size: 13px; color: #475569; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="report-container">
        <div class="title">数据自动覆盖合并分析报告</div>
        <div class="subinfo">生成时间: ${new Date().toLocaleString()}</div>
        
        <div class="info-block">
            <p style="margin:0 0 4px 0;"><strong>基础表 (Excel1):</strong> ${actualFile1Name}</p>
            <p style="margin:0 0 4px 0;"><strong>补充表 (Excel2):</strong> ${actualFile2Name}</p>
            <p style="margin:0 0 4px 0;"><strong>目标列:</strong> ${$('#targetColumn').val().trim().toUpperCase()}</p>
            <p style="margin:0;"><strong>KEY校验列:</strong> ${$('#uniqueKeyColumns').val().trim().toUpperCase()}</p>
        </div>`);

                    // 2. 写入第一部分：KEY错配记录
                    htmlParts.push(`<div class="section-title">一、KEY同行比对失败记录</div>`);
                    if (mismatchRows.length === 0) {
                        htmlParts.push(`<p class="log-p text-green">无 KEY 错配记录</p>`);
                    } else {
                        mismatchRows.forEach((item) => {
                            htmlParts.push(
                                `<p class="log-p">行 ${item.row} | W1: [<span>${item.k1}</span>] | W2: [<span>${item.k2}</span>]</p>`,
                            );
                        });
                    }

                    // 3. 写入第二部分：完整执行日志
                    htmlParts.push(`<div class="section-title">二、完整执行日志</div>`);
                    capturedLogs.forEach((log) => {
                        // 渲染时进行高亮替换
                        let renderText = log
                            .replace(
                                /( 成功填入新值 : ".*?")/g,
                                `<span class="text-green">$1</span>`,
                            )
                            .replace(/(【空 触发覆盖】)/g, `<span class="text-red">$1</span>`);

                        htmlParts.push(`<p class="log-p">${renderText}</p>`);
                    });

                    // 4. 闭合标签
                    htmlParts.push(`    </div>
</body>
</html>`);

                    // 5. 触发纯 HTML 报告文件下载
                    const blob = new Blob([htmlParts.join('\n')], {
                        type: 'text/html;charset=utf-8',
                    });
                    const a = document.createElement('a');
                    a.href = URL.createObjectURL(blob);
                    a.download = `合并数据分析报告-${timeStr}.html`;
                    a.click();
                }

                // ====================== 执行合并逻辑（增加console行号输出） ======================
                $('#btnProcess').click(async function () {
                    if (isRunning) {
                        alert('任务正在处理中，请等待完成！');
                        return;
                    }
                    const file1 = $('#uploadExcel1')[0].files[0];
                    const file2 = $('#uploadExcel2')[0].files[0];
                    if (!file1 || !file2) {
                        alert('请同时上传 Excel1 和 Excel2！');
                        return;
                    }

                    const targetColumnInput = $('#targetColumn').val();
                    const uniqueKeyInput = $('#uniqueKeyColumns').val();
                    const startRow = parseInt($('#startRow').val()) || 1;
                    const chosenColor = $('#fillColorSelect').val();

                    const targetColumns = parseColumnList(targetColumnInput);
                    const uniqueCols = parseColumnList(uniqueKeyInput);

                    if (targetColumns.length === 0 || uniqueCols.length === 0) {
                        alert('目标列、KEY列不能为空！');
                        return;
                    }

                    isRunning = true;
                    capturedLogs = [];
                    mismatchRows = [];
                    mergedRows = [];
                    actualFile1Name = file1.name;
                    actualFile2Name = file2.name;
                    $('#statusReport').html(
                        "<span class='text-yellow-400'>正在读取比对表格...</span>",
                    );
                    $('#btnDownload').prop('disabled', true);

                    try {
                        workbook1 = new ExcelJS.Workbook();
                        await workbook1.xlsx.load(file1);
                        const ws1 = workbook1.worksheets[0];

                        const workbook2 = new ExcelJS.Workbook();
                        await workbook2.xlsx.load(file2);
                        const ws2 = workbook2.worksheets[0];

                        // 取两个表格最大行号作为循环上限
                        const maxRows = Math.max(ws1.rowCount, ws2.rowCount);
                        console.log(`开始遍历，起始行：${startRow}，最大循环行：${maxRows}`);

                        for (let r = startRow; r <= maxRows; r++) {
                            console.log(`正在处理行号：${r}`); // 调试输出行号

                            let keyParts1 = [];
                            let keyParts2 = [];
                            uniqueCols.forEach((col) => {
                                const val1 = ws1.getCell(`${col}${r}`).value;
                                const val2 = ws2.getCell(`${col}${r}`).value;
                                keyParts1.push(
                                    val1 !== null && val1 !== undefined ? String(val1).trim() : '',
                                );
                                keyParts2.push(
                                    val2 !== null && val2 !== undefined ? String(val2).trim() : '',
                                );
                            });
                            const rowKey1 = keyParts1.join('_');
                            const rowKey2 = keyParts2.join('_');

                            if (rowKey1 !== rowKey2) {
                                mismatchRows.push({
                                    row: r,
                                    k1: rowKey1.replace(/_/g, ' | '),
                                    k2: rowKey2.replace(/_/g, ' | '),
                                });
                                const logStr = `[${getTimeStamp()}] [行号:${r}] 【🔑 KEY错配 整行跳过】 W1:"${rowKey1}" W2:"${rowKey2}"`;
                                capturedLogs.push(logStr);
                                continue;
                            }

                            for (const colName of targetColumns) {
                                const cell1 = ws1.getCell(`${colName}${r}`);
                                const cell2 = ws2.getCell(`${colName}${r}`);

                                let val1Str = '';
                                if (cell1.value !== null && cell1.value !== undefined) {
                                    if (
                                        typeof cell1.value === 'object' &&
                                        cell1.value.result !== undefined
                                    ) {
                                        val1Str = String(cell1.value.result);
                                    } else {
                                        val1Str = String(cell1.value);
                                    }
                                }
                                val1Str = val1Str.replace(/[\s\u00A0\u200B\r\n]/g, '');

                                let isCovered = '【有值 正常跳过】';
                                let fillDetail = '';

                                if (val1Str === '') {
                                    if (cell2.value !== null && cell2.value !== undefined) {
                                        let insertValue = cell2.value;
                                        if (
                                            insertValue &&
                                            typeof insertValue === 'object' &&
                                            insertValue.result !== undefined
                                        ) {
                                            insertValue = insertValue.result;
                                        }
                                        fillDetail = `（➔ 成功填入新值: "${JSON.stringify(insertValue)}"）`;
                                        isCovered = '【空 触发覆盖】';
                                        cell1.value = cell2.value;
                                        cell1.style = Object.create(cell1.style || {});
                                        if (cell2.alignment)
                                            cell1.alignment = Object.assign({}, cell2.alignment);
                                        if (cell2.border)
                                            cell1.border = Object.assign({}, cell2.border);
                                        if (cell2.numFmt) cell1.numFmt = cell2.numFmt;

                                        if (chosenColor !== 'NONE') {
                                            cell1.fill = {
                                                type: 'pattern',
                                                pattern: 'solid',
                                                fgColor: { argb: chosenColor },
                                            };
                                            const light = chosenColor === 'FFF2BA02';
                                            const baseFont = cell2.font || {};
                                            cell1.font = Object.assign({}, baseFont, {
                                                color: { argb: light ? 'FF000000' : 'FFFFFFFF' },
                                            });
                                        } else {
                                            if (cell2.font)
                                                cell1.font = Object.assign({}, cell2.font);
                                        }
                                        if (!mergedRows.includes(r)) mergedRows.push(r);
                                    } else {
                                        fillDetail = `（补充表无数据，无法填充）`;
                                        isCovered = '【空 无法覆盖】';
                                    }
                                }

                                const logMessage = `[${getTimeStamp()}] [行号:${r}] 列:${colName} | 原值:${JSON.stringify(cell1.value)} | ${isCovered} ${fillDetail}`;
                                capturedLogs.push(logMessage);
                                console.log(logMessage);
                            }
                        }

                        console.log(`遍历完成！总共采集日志：${capturedLogs.length} 条`);
                        if (mergedRows.length > 0) {
                            const intervals = getLineIntervals(mergedRows);
                            let reportHtml = `<span class='text-green-400 font-bold'>🎉 合并成功！共补充 ${mergedRows.length} 行数据。</span><br>`;
                            intervals.forEach((range) => {
                                reportHtml += `🔹 <span class='text-blue-400'>${range}行</span> ${targetColumns.join('、')} 完成填充<br>`;
                            });
                            $('#statusReport').html(reportHtml);
                        } else {
                            $('#statusReport').html(
                                "<span class='text-gray-400'>全部目标列已有内容，未执行填充。</span>",
                            );
                        }
                        $('#btnDownload')
                            .removeAttr('disabled')
                            .removeClass('bg-slate-300 text-slate-500 cursor-not-allowed')
                            .addClass('bg-green-600 text-white hover:bg-green-700');
                    } catch (err) {
                        console.error(err);
                        $('#statusReport').html(
                            `<span class='text-red-500'>❌ 处理失败：${err.message}</span>`,
                        );
                    } finally {
                        isRunning = false;
                    }
                });

                // ====================== 下载按钮 ======================
                $('#btnDownload').click(async function () {
                    if (!workbook1) return;
                    $('#statusReport').append(
                        "<br><span class='text-yellow-400 animate-pulse'>正在打包文件...</span>",
                    );
                    const now = new Date();
                    const timeStr =
                        `${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, '0')}${String(now.getDate()).padStart(2, '0')}` +
                        `${String(now.getHours()).padStart(2, '0')}${String(now.getMinutes()).padStart(2, '0')}${String(now.getSeconds()).padStart(2, '0')}`;

                    // 导出Excel
                    const buffer = await workbook1.xlsx.writeBuffer();
                    const blob = new Blob([buffer], {
                        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
                    });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    const baseName = actualFile1Name.replace(/\.xlsx$/i, '');
                    link.download = `[已自动合并]_${baseName}-${timeStr}.xlsx`;
                    link.click();

                    // 导出SVG报告
                    await exportSvgReport(timeStr);

                    $('#statusReport').find('.animate-pulse').remove();
                    $('#statusReport').append(
                        `<br><span class='text-green-500 font-bold'>✅ Excel + 报告文件下载完成！</span>`,
                    );
                });
            });
        </script>
    </body>
</html>
